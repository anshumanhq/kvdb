name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build (ASan+UBSan) & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Build debug
        run: make debug

      - name: Run tests (ASan + UBSan)
        run: make test

  valgrind-on-release:
    name: Valgrind (release build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential valgrind

      - name: Build release
        run: make release

      - name: Run tests (release build)
        run: make test-release

      - name: Valgrind leak check
        run: |
          valgrind --leak-check=full \
                   --track-origins=yes \
                   --error-exitcode=1 \
                   ./build/test_hashtable_release

  docker-build-and-test:
    name: Build & Test Docker Image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t kvdb:test .

      - name: Run Docker Container
        run: |
          docker run -d --name test-kvdb -p 6380:6380 kvdb:test
          sleep 2 # Container ko start hone ka time do

      - name: Test with redis-cli (Ping)
        run: |
          sudo apt-get update && sudo apt-get install -y redis-tools
          redis-cli -p 6380 ping
          # Agar ping ka reply 'PONG' aata hai, toh test pass ho jayega
          response=$(redis-cli -p 6380 ping)
          if [ "$response" != "PONG" ]; then
            echo "Docker container test failed!"
            exit 1
          fi

      - name: Stop Container
        run: docker stop test-kvdb
